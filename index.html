<script>
  // ====== CẤU HÌNH SUPABASE ======
  const supabaseUrl = 'https://shpgeimrysxupveqibyh.supabase.co';
  const supabaseKey = 'sb_publishable_MUSk9i-KqoD2axABqY3DrA_pBYgkmd_';
  const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = d => d ? new Date(d).toLocaleString('vi-VN') : '—';
  const VIEWS = ['authView','otpView','forgotView','resetView','appView','adminView','banView'];
  let mode='login', method='email', fMethod='email';
  let currentUser=null, isAdmin=false, otpContext=null, recoveryMode=false, currentView='authView';
  let adminUsers=[], pollTimer=null;

  // ====== BẢO MẬT: CHẶN F12 & ÉP TOÀN MÀN HÌNH ======
  document.addEventListener('keydown', function(e) {
    if (
        e.key === 'F12' || 
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || 
        (e.ctrlKey && e.key === 'U')
    ) {
        e.preventDefault();
        toast('Hệ thống bảo mật: Phím tắt này đã bị vô hiệu hóa!', 'error');
        return false;
    }
  });

  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    toast('Hệ thống bảo mật: Thao tác chuột phải bị hạn chế.', 'error');
  });

  function checkFullScreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
        let warningBox = $('fsWarning');
        if (!warningBox) {
            warningBox = document.createElement('div');
            warningBox.id = 'fsWarning';
            warningBox.style.cssText = 'position:fixed;inset:0;background:rgba(3,6,16,0.96);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:sans-serif;text-align:center;padding:20px;';
            warningBox.innerHTML = `
                <div style="font-size:56px;margin-bottom:10px;">⚠️</div>
                <h2 style="color:#ff5c6c;margin-bottom:10px;font-size:22px;">Yêu cầu giám sát bảo mật hệ thống</h2>
                <p style="margin-bottom:24px;color:#9ba6c7;font-size:14px;max-width:400px;line-height:1.5;">Hệ thống đang ở chế độ giám sát. Bạn bắt buộc phải chuyển sang chế độ toàn màn hình (Full màn hình) để tiếp tục sử dụng.</p>
                <button id="requestFsBtn" style="padding:12px 28px;background:linear-gradient(135deg,#3ecf8e,#2bb6a0);border:0;border-radius:11px;font-weight:800;cursor:pointer;color:#05261a;font-size:15px;box-shadow:0 10px 24px rgba(62,207,142,.3);">Bật toàn màn hình ngay (F11)</button>
            `;
            document.body.appendChild(warningBox);
            
            $('requestFsBtn').onclick = () => {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            };
        }
        warningBox.style.display = 'flex';
    } else {
        const warningBox = $('fsWarning');
        if (warningBox) warningBox.style.display = 'none';
    }
  }

  setInterval(checkFullScreen, 1000);
  document.addEventListener('fullscreenchange', checkFullScreen);

  // ====== TIỆN ÍCH ======
  let toastTimer;
  function toast(msg,type='success'){
    const t=$('toast'); t.textContent=msg; t.className='show '+type;
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.className='',3800);
  }
  function setStatus(ok,text){ $('status').className='status '+(ok?'ok':'err'); $('statusText').textContent=text; }
  function show(view){
    currentView=view;
    VIEWS.forEach(v=>$(v).classList.toggle('hidden',v!==view));
    const sh=$('shell');
    sh.classList.toggle('single',['appView','banView'].includes(view));
    sh.classList.toggle('wide',view==='adminView');
    $('status').classList.toggle('hidden',['appView','adminView','banView'].includes(view));
  }
  function normPhone(p){
    p=(p||'').replace(/[\s.\-()]/g,'');
    if(p.startsWith('+')) return p;
    if(p.startsWith('00')) return '+'+p.slice(2);
    if(p.startsWith('0')) return '+84'+p.slice(1);
    return '+'+p;
  }
  const validPhone=p=>/^\+\d{9,15}$/.test(p);
  const validEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
  function translateError(msg=''){
    const m=msg.toLowerCase();
    if(m.includes('invalid login')) return 'Tài khoản hoặc mật khẩu không đúng.';
    if(m.includes('already registered')||m.includes('already been registered')) return 'Tài khoản này đã được đăng ký.';
    if(m.includes('not confirmed')) return 'Tài khoản chưa được xác nhận.';
    if(m.includes('password should be')) return 'Mật khẩu quá yếu (tối thiểu 6 ký tự).';
    if(m.includes('same as the old')) return 'Mật khẩu mới phải khác mật khẩu cũ.';
    if(m.includes('rate limit')||m.includes('too many')||m.includes('security purposes')) return 'Máy chủ đang giới hạn số lần gửi yêu cầu. Vui lòng đợi ít phút rồi thử lại.';
    if(m.includes('token has expired')||(m.includes('invalid')&&m.includes('otp'))) return 'Mã OTP sai hoặc đã hết hạn.';
    if(m.includes('provider')&&m.includes('disabled')) return 'Máy chủ chưa bật tính năng này.';
    if(m.includes('sms')||m.includes('twilio')) return 'Máy chủ chưa cấu hình gửi SMS.';
    if(m.includes('could not find the function')||m.includes('schema cache')) return 'Chưa cài đặt phần Admin trên cơ sở dữ liệu. Hãy chạy file SQL Admin.';
    if(m.includes('failed to fetch')) return 'Mất kết nối mạng, vui lòng thử lại.';
    return msg;
  }
  async function busy(btn,label,fn){
    if(btn.disabled) return;
    const old=btn.textContent; btn.disabled=true; btn.textContent=label;
    try{ await fn(); }catch(err){ toast(translateError(err.message||String(err)),'error'); }
    finally{ btn.disabled=false; btn.textContent=old; }
  }
  async function rpc(name,args={}){
    const {data,error}=await _supabase.rpc(name,args);
    if(error) throw error;
    if(data && data.ok===false) throw new Error(data.error||'Có lỗi xảy ra.');
    return data;
  }
  async function copyText(t){
    try{ await navigator.clipboard.writeText(t); }
    catch{ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); }
    toast('Đã sao chép!');
  }
  function remain(until){
    if(!until) return 'Vĩnh viễn';
    const ms=new Date(until)-Date.now();
    if(ms<=0) return 'Đã hết hạn';
    const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);
    return [d?d+' ngày':'',h?h+' giờ':'',(!d&&m)?m+' phút':''].filter(Boolean).join(' ')||'Dưới 1 phút';
  }
  document.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{const i=$(b.dataset.eye);i.type=i.type==='password'?'text':'password';});

  // ====== MODAL ======
  const openModal=id=>$(id).classList.add('open');
  const closeModals=()=>document.querySelectorAll('.modal-back').forEach(m=>m.classList.remove('open'));
  document.querySelectorAll('.modal-back').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m||e.target.hasAttribute('data-close')) closeModals(); }));
  addEventListener('keydown',e=>{ if(e.key==='Escape') closeModals(); });
  $('footInfo').onclick=()=>openModal('mInfo');
  $('infoBtn').onclick=()=>openModal('mInfo');

  function askPassword(title){
    return new Promise(resolve=>{
      $('passTitle').textContent=title; $('passInput').value=''; openModal('mPass');
      setTimeout(()=>$('passInput').focus(),50);
      const done=v=>{ $('passOk').onclick=null; $('mPass').removeEventListener('click',onBack); closeModals(); resolve(v); };
      const onBack=e=>{ if(e.target.id==='mPass'||e.target.hasAttribute('data-close')) done(null); };
      $('mPass').addEventListener('click',onBack);
      $('passOk').onclick=()=>done($('passInput').value);
      $('passInput').onkeydown=e=>{ if(e.key==='Enter') done($('passInput').value); };
    });
  }

  // ====== ĐĂNG NHẬP / ĐĂNG KÝ UI ======
  function refreshAuthUI(){
    const reg=mode==='register', phone=method==='phone';
    $('tabLogin').classList.toggle('active',!reg); $('tabRegister').classList.toggle('active',reg);
    $('mEmail').classList.toggle('active',!phone); $('mPhone').classList.toggle('active',phone);
    $('emailField').classList.toggle('hidden',phone); $('phoneField').classList.toggle('hidden',!phone);
    $('nameField').classList.toggle('hidden',!reg); $('confirmField').classList.toggle('hidden',!reg);
    $('forgotRow').classList.toggle('hidden',reg); $('regHint').classList.toggle('hidden',!reg);
    $('regHint').textContent=phone?'Mã OTP sẽ được gửi qua SMS để xác nhận số điện thoại của bạn.':'Đăng ký xong bạn có thể đăng nhập ngay (nếu máy chủ không yêu cầu xác nhận email).';
    $('submitBtn').textContent=reg?'Tạo tài khoản':'Đăng nhập';
    $('authTitle').textContent=reg?'Tạo tài khoản mới':'Chào mừng trở lại';
    $('authSub').textContent=reg?'Chỉ mất vài giây để bắt đầu.':'Đăng nhập để truy cập dữ liệu của bạn.';
    $('password').autocomplete=reg?'new-password':'current-password';
  }
  $('tabLogin').onclick=()=>{mode='login';refreshAuthUI()};
  $('tabRegister').onclick=()=>{mode='register';refreshAuthUI()};
  $('mEmail').onclick=()=>{method='email';refreshAuthUI()};
  $('mPhone').onclick=()=>{method='phone';refreshAuthUI()};

  $('authForm').addEventListener('submit',e=>{
    e.preventDefault();
    busy($('submitBtn'),'Đang xử lý...',async()=>{
      const password=$('password').value; let id;
      if(method==='email'){ id=$('email').value.trim(); if(!validEmail(id)) throw new Error('Email không hợp lệ.'); }
      else{ id=normPhone($('phone').value); if(!validPhone(id)) throw new Error('Số điện thoại không hợp lệ.'); }
      if(password.length<6) throw new Error('Mật khẩu phải có ít nhất 6 ký tự.');
      const cred=method==='email'?{email:id}:{phone:id};
      if(mode==='register'){
        const fullName=$('fullName').value.trim();
        if(!fullName) throw new Error('Vui lòng nhập họ và tên.');
        if(password!==$('confirm').value) throw new Error('Mật khẩu nhập lại không khớp.');
        const {data,error}=await _supabase.auth.signUp({...cred,password,options:{data:{full_name:fullName}}});
        if(error) throw error;
        if(data.session){ toast('Đăng ký thành công! 🎉'); return; }
        if(method==='phone'){
          otpContext={type:'sms',phone:id};
          $('otpSub').textContent='Mã OTP đã gửi tới '+id+'.'; $('otp').value=''; show('otpView'); toast('Đã gửi mã OTP qua SMS.');
        }else{ toast('Đăng ký thành công! Hãy kiểm tra email để xác nhận tài khoản.'); mode='login'; refreshAuthUI(); }
      }else{
        const {error}=await _supabase.auth.signInWithPassword({...cred,password});
        if(error) throw error;
        toast('Đăng nhập thành công!');
      }
    });
  });

  // ====== OTP ======
  $('otpForm').addEventListener('submit',e=>{
    e.preventDefault();
    busy($('otpBtn'),'Đang xác nhận...',async()=>{
      const token=$('otp').value.trim();
      if(token.length<4) throw new Error('Vui lòng nhập mã OTP.');
      const {error}=await _supabase.auth.verifyOtp({phone:otpContext.phone,token,type:otpContext.type});
      if(error) throw error;
      if(otpContext.purpose==='recovery'){ recoveryMode=true; show('resetView'); toast('Xác minh thành công, hãy đặt mật khẩu mới.'); }
      else toast('Xác nhận thành công! 🎉');
    });
  });
  $('otpBack').onclick=()=>show(otpContext?.purpose==='recovery'?'forgotView':'authView');
  $('otpResend').onclick=()=>busy($('otpResend'),'Đang gửi...',async()=>{
    if(otpContext.purpose==='recovery'){
      const {error}=await _supabase.auth.signInWithOtp({phone:otpContext.phone,options:{shouldCreateUser:false}}); if(error) throw error;
    }else{
      const {error}=await _supabase.auth.resend({type:'sms',phone:otpContext.phone}); if(error) throw error;
    }
    toast('Đã gửi lại mã OTP.');
  });

  // ====== QUÊN MẬT KHẨU ======
  $('forgotLink').onclick=()=>show('forgotView');
  $('forgotBack').onclick=()=>show('authView');
  $('fEmailTab').onclick=()=>{fMethod='email';$('fEmailTab').classList.add('active');$('fPhoneTab').classList.remove('active');$('fEmailField').classList.remove('hidden');$('fPhoneField').classList.add('hidden')};
  $('fPhoneTab').onclick=()=>{fMethod='phone';$('fPhoneTab').classList.add('active');$('fEmailTab').classList.remove('active');$('fPhoneField').classList.remove('hidden');$('fEmailField').classList.add('hidden')};
  $('forgotForm').addEventListener('submit',e=>{
    e.preventDefault();
    busy($('forgotBtn'),'Đang gửi...',async()=>{
      if(fMethod==='email'){
        const email=$('fEmail').value.trim();
        if(!validEmail(email)) throw new Error('Email không hợp lệ.');
        const {error}=await _supabase.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]});
        if(error) throw error;
        toast('Nếu email tồn tại, liên kết đặt lại mật khẩu đã được gửi. Hãy kiểm tra hộp thư.');
      }else{
        const phone=normPhone($('fPhone').value);
        if(!validPhone(phone)) throw new Error('Số điện thoại không hợp lệ.');
        const {error}=await _supabase.auth.signInWithOtp({phone,options:{shouldCreateUser:false}});
        if(error) throw error;
        otpContext={type:'sms',phone,purpose:'recovery'};
        $('otpSub').textContent='Mã OTP đã gửi tới '+phone+'. Nhập mã để đặt lại mật khẩu.'; $('otp').value=''; show('otpView'); toast('Đã gửi mã OTP qua SMS.');
      }
    });
  });
  $('resetForm').addEventListener('submit',e=>{
    e.preventDefault();
    busy($('resetBtn'),'Đang cập nhật...',async()=>{
      const p1=$('newPass').value,p2=$('newPass2').value;
      if(p1.length<6) throw new Error('Mật khẩu phải có ít nhất 6 ký tự.');
      if(p1!==p2) throw new Error('Mật khẩu nhập lại không khớp.');
      const {error}=await _supabase.auth.updateUser({password:p1}); if(error) throw error;
      recoveryMode=false; toast('Đã đổi mật khẩu thành công!');
      const {data}=await _supabase.auth.getSession(); await enterApp(data.session?.user??null);
    });
  });

  async function logout(){ await _supabase.auth.signOut(); toast('Đã đăng xuất.'); }
  $('logoutBtn').onclick=logout; $('adminLogout').onclick=logout; $('banLogout').onclick=logout;

  // ====== VÀO ỨNG DỤNG / KIỂM TRA CẤM ======
  async function getMyBan(){
    const {data,error}=await _supabase.rpc('get_my_ban');
    if(error){ console.warn('get_my_ban:',error.message); return null; }
    return data||null;
  }
  function showBan(ban){
    $('banReasonText').textContent=ban.reason||'Không có lý do';
    $('banFromText').textContent=fmt(ban.banned_at);
    $('banUntilText').textContent=ban.banned_until?fmt(ban.banned_until):'Vĩnh viễn';
    $('banLeftText').textContent=remain(ban.banned_until);
    show('banView');
  }
  async function enterApp(user){
    currentUser=user;
    if(!user){ isAdmin=false; stopPoll(); show('authView'); $('authForm').reset(); $('dataList').innerHTML=''; return; }
    if(recoveryMode){ show('resetView'); return; }
    const ban=await getMyBan();
    startPoll();
    if(ban){ isAdmin=false; showBan(ban); return; }
    const {data}=await _supabase.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();
    isAdmin=!!data;
    const name=user.user_metadata?.full_name||user.email?.split('@')[0]||user.phone||'Người dùng';
    $('userName').textContent=name;
    $('userContact').textContent=user.email||user.phone||'';
    $('avatar').textContent=name.charAt(0).toUpperCase();
    $('adminBadge').classList.toggle('hidden',!isAdmin);
    show('appView'); loadData();
  }
  $('banRecheck').onclick=()=>busy($('banRecheck'),'Đang kiểm tra...',async()=>{
    const ban=await getMyBan();
    if(ban){ showBan(ban); toast('Tài khoản vẫn đang bị cấm.','error'); } else { await enterApp(currentUser); toast('Tài khoản đã được mở lại!'); }
  });
  function startPoll(){
    stopPoll();
    pollTimer=setInterval(async()=>{
      if(!currentUser||recoveryMode) return;
      const ban=await getMyBan();
      if(ban && currentView!=='banView'){ showBan(ban); toast('Tài khoản của bạn vừa bị cấm.','error'); }
      else if(!ban && currentView==='banView'){ await enterApp(currentUser); toast('Tài khoản đã được mở lại!'); }
      else if(ban && currentView==='banView'){ $('banLeftText').textContent=remain(ban.banned_until); }
    },30000);
  }
  function stopPoll(){ clearInterval(pollTimer); pollTimer=null; }

  // ====== GHI CHÚ ======
  function noteItem(item,opts={}){
    const li=document.createElement('li');
    const box=document.createElement('div'); box.className='txt';
    const t=document.createElement('div'); t.textContent=item.content;
    const meta=document.createElement('span'); meta.className='time';
    meta.textContent=(opts.owner?'👤 '+opts.owner+' · ':'')+fmt(item.created_at)+(item.updated_at?' · đã sửa '+fmt(item.updated_at):'');
    box.append(t,meta);
    const act=document.createElement('div'); act.className='act';
    const ed=document.createElement('button'); ed.textContent='✏️'; ed.title='Sửa';
    const del=document.createElement('button'); del.textContent='🗑'; del.title='Xóa';
    act.append(ed,del); li.append(box,act);

    ed.onclick=()=>{
      box.innerHTML=''; act.classList.add('hidden');
      const row=document.createElement('div'); row.className='editrow';
      const inp=document.createElement('input'); inp.type='text'; inp.value=item.content; inp.maxLength=500;
      const ok=document.createElement('button'); ok.className='btn sm'; ok.textContent='Lưu';
      const no=document.createElement('button'); no.className='btn sm ghost'; no.textContent='Hủy';
      row.append(inp,ok,no); box.append(row); inp.focus();
      no.onclick=()=>opts.reload();
      const save=()=>busy(ok,'Đang lưu...',async()=>{
        const v=inp.value.trim(); if(!v) throw new Error('Nội dung không được để trống.');
        const {data,error}=await _supabase.from('notes').update({content:v}).eq('id',item.id).select();
        if(error) throw error;
        if(!data||!data.length) throw new Error('Không có quyền sửa mục này.');
        toast('Đã cập nhật dữ liệu.'); opts.reload();
      });
      ok.onclick=save; inp.onkeydown=e=>{ if(e.key==='Enter') save(); if(e.key==='Escape') opts.reload(); };
    };
    del.onclick=async()=>{
      if(!confirm('Bạn chắc chắn muốn xóa mục này?')) return;
      const {data,error}=await _supabase.from('notes').delete().eq('id',item.id).select();
      if(error) return toast('Lỗi khi xóa: '+translateError(error.message),'error');
      if(!data||!data.length) return toast('Không có quyền xóa mục này.','error');
      toast('Đã xóa.'); opts.reload();
    };
    return li;
  }
  async function loadData(){
    if(!currentUser) return;
    const list=$('dataList');
    const {data,error}=await _supabase.from('notes').select('*').eq('user_id',currentUser.id).order('created_at',{ascending:false});
    list.innerHTML='';
    if(error){ list.innerHTML='<li class="empty">Không tải được dữ liệu. Hãy chạy đủ các đoạn SQL trên Supabase.</li>'; console.error(error); return; }
    $('countText').textContent=data.length+' mục';
    if(!data.length){ list.innerHTML='<li class="empty">Bạn chưa có dữ liệu nào. Hãy thêm mục đầu tiên!</li>'; return; }
    data.forEach(item=>list.appendChild(noteItem(item,{reload:loadData})));
  }
  async function addData(){
    const input=$('dataInput'),text=input.value.trim();
    if(!text) return toast('Vui lòng nhập nội dung!','error');
    $('addBtn').disabled=true;
    const {error}=await _supabase.from('notes').insert([{content:text,user_id:currentUser.id}]);
    $('addBtn').disabled=false;
    if(error) return toast('Lỗi khi gửi dữ liệu: '+translateError(error.message),'error');
    input.value=''; toast('Đã thêm dữ liệu thành công!'); loadData();
  }
  $('addBtn').onclick=addData;
  $('dataInput').addEventListener('keydown',e=>{ if(e.key==='Enter') addData(); });

  // ====== ADMIN ======
  $('mtEnter').onclick=()=>{$('mtEnter').classList.add('active');$('mtGen').classList.remove('active');$('mpEnter').classList.remove('hidden');$('mpGen').classList.add('hidden')};
  $('mtGen').onclick=()=>{$('mtGen').classList.add('active');$('mtEnter').classList.remove('active');$('mpGen').classList.remove('hidden');$('mpEnter').classList.add('hidden')};
  $('adminBtn').onclick=()=>{ if(isAdmin) openAdmin(); else { $('adminCode').value=''; openModal('mAdmin'); } };

  $('adminCodeBtn').onclick=()=>busy($('adminCodeBtn'),'Đang kiểm tra...',async()=>{
    const code=$('adminCode').value.trim();
    if(!code) throw new Error('Vui lòng nhập mã Admin.');
    await rpc('redeem_admin_code',{p_code:code});
    isAdmin=true; $('adminBadge').classList.remove('hidden');
    closeModals(); toast('Xác nhận thành công! Bạn đã là Admin 👑'); openAdmin();
  });
  $('adminCode').addEventListener('keydown',e=>{ if(e.key==='Enter') $('adminCodeBtn').click(); });

  function bindGen(passId,btnId,outId){
    $(btnId).onclick=()=>busy($(btnId),'Đang tạo...',async()=>{
      const pw=$(passId).value;
      if(!pw) throw new Error('Vui lòng nhập mật khẩu.');
      const r=await rpc('generate_admin_code',{p_password:pw});
      $(passId).value='';
      $(outId).innerHTML=`<div class="codebox"><code>${esc(r.code)}</code><button class="btn sm ghost" data-copy="${esc(r.code)}" type="button">Sao chép</button></div>
        <p class="hint">Hiệu lực đến <b>${esc(fmt(r.expires_at))}</b> (24 giờ), dùng được 1 lần.</p>`;
      toast('Đã tạo mã Admin.');
    });
  }
  bindGen('genPass','genBtn','genOut'); bindGen('genPass2','genBtn2','genOut2');
  document.addEventListener('click',e=>{ const c=e.target.closest('[data-copy]'); if(c) copyText(c.dataset.copy); });

  function openAdmin(){ show('adminView'); switchTab('users'); }
  $('adminBack').onclick=()=>show('appView');
  $('adminTabs').addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(b) switchTab(b.dataset.tab); });
  function switchTab(name){
    document.querySelectorAll('#adminTabs .tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
    ['users','ban','bans','data','admins'].forEach(n=>$('tab-'+n).classList.toggle('hidden',n!==name));
    if(name==='users') loadAdminUsers();
    if(name==='bans') loadBans();
    if(name==='data') loadAdminData();
    if(name==='admins') loadAdmins();
  }

  async function loadAdminUsers(){
    $('uList').innerHTML='<div class="empty">Đang tải...</div>';
    try{ const r=await rpc('admin_list_users'); adminUsers=r.users||[]; renderUsers(); }
    catch(err){ $('uList').innerHTML='<div class="empty">'+esc(translateError(err.message))+'</div>'; }
  }
  function renderUsers(){
    const q=$('uSearch').value.trim().toLowerCase();
    const list=adminUsers.filter(u=>!q||[u.email,u.phone,u.full_name,u.id].some(x=>(x||'').toLowerCase().includes(q)));
    $('uList').innerHTML=list.length?list.map(u=>`
      <div class="item"><div class="grow">
        <b>${esc(u.full_name||'(chưa đặt tên)')}</b>
        ${u.is_admin?'<span class="badge admin">ADMIN</span>':''}${u.ban?'<span class="badge ban">BỊ CẤM</span>':'<span class="badge okb">Hoạt động</span>'}
        <small>${esc(u.email||u.phone||'—')}</small>
        <small class="mono" data-copy="${esc(u.id)}">ID: ${esc(u.id)} (chạm để sao chép)</small>
        <small>${u.notes_count} ghi chú · tham gia ${esc(fmt(u.created_at))}</small>
        ${u.ban?`<small class="warn">Lý do: ${esc(u.ban.reason)} · hết hạn: ${u.ban.banned_until?esc(fmt(u.ban.banned_until)):'vĩnh viễn'}</small>`:''}
      </div><div class="btns">${u.is_admin?'':(u.ban
        ?`<button class="btn sm ghost" data-act="unban" data-id="${esc(u.id)}" type="button">Gỡ cấm</button>`
        :`<button class="btn sm danger" data-act="ban" data-id="${esc(u.id)}" type="button">Cấm</button>`)}</div></div>`).join('')
      :'<div class="empty">Không có người dùng nào.</div>';
  }
  $('uSearch').addEventListener('input',renderUsers);
  $('uRefresh').onclick=loadAdminUsers;
  $('uList').addEventListener('click',async e=>{
    const b=e.target.closest('[data-act]'); if(!b) return;
    if(b.dataset.act==='ban'){ switchTab('ban'); $('banTarget').value=b.dataset.id; $('banDays').focus(); }
    if(b.dataset.act==='unban'){ await doUnban(b.dataset.id); loadAdminUsers(); }
  });

  $('banPerm').onchange=()=>$('banDaysField').classList.toggle('hidden',$('banPerm').checked);
  $('banForm').addEventListener('submit',e=>{
    e.preventDefault();
    busy($('banBtn'),'Đang xử lý...',async()=>{
      const target=$('banTarget').value.trim(), perm=$('banPerm').checked, days=parseInt($('banDays').value,10), reason=$('banReason').value.trim();
      if(!target) throw new Error('Nhập User ID hoặc Gmail cần cấm.');
      if(!perm&&!(days>=1&&days<=3650)) throw new Error('Nhập số ngày cấm (từ 1 đến 3650).');
      if(!reason) throw new Error('Vui lòng nhập lý do cấm.');
      if(!confirm(`Xác nhận cấm "${target}" ${perm?'VĨNH VIỄN':days+' ngày'}?\nLý do: ${reason}`)) return;
      const r=await rpc('admin_ban_user',{p_identifier:target,p_days:perm?null:days,p_permanent:perm,p_reason:reason});
      toast('Đã cấm tài khoản'+(r.banned_until?' đến '+fmt(r.banned_until):' vĩnh viễn')+'.');
      $('banForm').reset(); $('banDaysField').classList.remove('hidden');
    });
  });
  async function doUnban(target){
    try{ await rpc('admin_unban_user',{p_identifier:target}); toast('Đã gỡ cấm tài khoản.'); }
    catch(err){ toast(translateError(err.message),'error'); }
  }
  $('unbanBtn').onclick=()=>busy($('unbanBtn'),'Đang xử lý...',async()=>{
    const t=$('unbanTarget').value.trim(); if(!t) throw new Error('Nhập User ID hoặc Gmail cần gỡ cấm.');
    await rpc('admin_unban_user',{p_identifier:t}); toast('Đã gỡ cấm tài khoản.'); $('unbanTarget').value='';
  });

  async function loadBans(){
    $('bList').innerHTML='<div class="empty">Đang tải...</div>';
    try{
      const r=await rpc('admin_list_bans'); const bans=r.bans||[];
      $('bList').innerHTML=bans.length?bans.map(b=>{
        const st=b.lifted_at?'<span class="badge gray">Đã gỡ</span>':b.active?'<span class="badge ban">Đang cấm</span>':'<span class="badge gray">Hết hạn</span>';
        return `<div class="item"><div class="grow"><b>${esc(b.full_name||b.email||b.user_id)}</b> ${st}
          <small>${esc(b.email||'')}</small>
          <small class="mono" data-copy="${esc(b.user_id)}">ID: ${esc(b.user_id)}</small>
          <small>Lý do: ${esc(b.reason)}</small>
          <small>Từ ${esc(fmt(b.banned_at))} → ${b.banned_until?esc(fmt(b.banned_until)):'vĩnh viễn'}${b.lifted_at?' · gỡ lúc '+esc(fmt(b.lifted_at)):''}</small></div>
          <div class="btns">${b.active?`<button class="btn sm ghost" data-unban="${esc(b.user_id)}" type="button">Gỡ cấm</button>`:''}</div></div>`;
      }).join(''):'<div class="empty">Chưa có lịch sử cấm.</div>';
    }catch(err){ $('bList').innerHTML='<div class="empty">'+esc(translateError(err.message))+'</div>'; }
  }
  $('bRefresh').onclick=loadBans;
  $('bList').addEventListener('click',async e=>{ const b=e.target.closest('[data-unban]'); if(b){ await doUnban(b.dataset.unban); loadBans(); } });

  let dTimer;
  async function loadAdminData(){
    const list=$('dList'); list.innerHTML='<li class="empty">Đang tải...</li>';
    try{
      const r=await rpc('admin_list_notes',{p_search:$('dSearch').value.trim()}); const notes=r.notes||[];
      list.innerHTML='';
      if(!notes.length){ list.innerHTML='<li class="empty">Không có dữ liệu.</li>'; return; }
      notes.forEach(n=>list.appendChild(noteItem(n,{owner:n.email||n.full_name||n.user_id,reload:loadAdminData})));
    }catch(err){ list.innerHTML='<li class="empty">'+esc(translateError(err.message))+'</li>'; }
  }
  $('dSearch').addEventListener('input',()=>{ clearTimeout(dTimer); dTimer=setTimeout(loadAdminData,350); });
  $('dRefresh').onclick=loadAdminData;

  async function loadAdmins(){
    $('aList').innerHTML='<div class="empty">Đang tải...</div>';
    try{
      const r=await rpc('admin_list_admins'); const a=r.admins||[];
      $('aList').innerHTML=a.length?a.map(x=>`<div class="item"><div class="grow"><b>${esc(x.full_name||x.email||x.user_id)}</b> <span class="badge admin">ADMIN</span>
        <small>${esc(x.email||'')}</small><small class="mono" data-copy="${esc(x.user_id)}">ID: ${esc(x.user_id)}</small>
        <small>Được cấp quyền: ${esc(fmt(x.granted_at))}</small></div>
        <div class="btns"><button class="btn sm danger" data-revoke="${esc(x.user_id)}" type="button">Thu hồi</button></div></div>`).join('')
        :'<div class="empty">Chưa có quản trị viên.</div>';
    }catch(err){ $('aList').innerHTML='<div class="empty">'+esc(translateError(err.message))+'</div>'; }
  }
  $('aRefresh').onclick=loadAdmins;
  $('aList').addEventListener('click',async e=>{
    const b=e.target.closest('[data-revoke]'); if(!b) return;
    const pw=await askPassword('Thu hồi quyền Admin'); if(!pw) return;
    try{
      await rpc('admin_revoke',{p_user:b.dataset.revoke,p_password:pw});
      toast('Đã thu hồi quyền Admin.');
      if(b.dataset.revoke===currentUser.id){ isAdmin=false; $('adminBadge').classList.add('hidden'); show('appView'); } else loadAdmins();
    }catch(err){ toast(translateError(err.message),'error'); }
  });

  // ====== KHỞI ĐỘNG ======
  _supabase.auth.onAuthStateChange((event,session)=>{
    if(event==='PASSWORD_RECOVERY') recoveryMode=true;
    if(event==='TOKEN_REFRESHED') return;
    const u=session?.user??null;
    if(u&&currentUser&&u.id===currentUser.id&&event!=='USER_UPDATED'&&!recoveryMode) return;
    setTimeout(()=>enterApp(u),0);
  });
  (async()=>{
    try{ const {error}=await _supabase.auth.getSession(); if(error) throw error; setStatus(true,'Kết nối máy chủ thành công'); }
    catch(err){ setStatus(false,'Không kết nối được máy chủ'); console.error(err); }
  })();
  refreshAuthUI();

  // ====== HẠT SÁNG NỀN ======
  (function(){
    const c=$('particles'),ctx=c.getContext('2d');
    if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
    let W,H,P=[];
    function size(){W=c.width=innerWidth;H=c.height=innerHeight;
      P=Array.from({length:Math.min(70,Math.floor(W*H/22000))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35}));}
    addEventListener('resize',size); size();
    (function tick(){
      ctx.clearRect(0,0,W,H);
      for(const p of P){ p.x+=p.vx;p.y+=p.vy; if(p.x<0||p.x>W)p.vx*=-1; if(p.y<0||p.y>H)p.vy*=-1;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fillStyle='rgba(180,255,220,.7)';ctx.fill(); }
      for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
        const dx=P[i].x-P[j].x,dy=P[i].y-P[j].y,d=dx*dx+dy*dy;
        if(d<14000){ctx.strokeStyle='rgba(120,200,255,'+(.18*(1-d/14000))+')';ctx.beginPath();ctx.moveTo(P[i].x,P[i].y);ctx.lineTo(P[j].x,P[j].y);ctx.stroke();}
      }
      requestAnimationFrame(tick);
    })();
  })();
</script>
