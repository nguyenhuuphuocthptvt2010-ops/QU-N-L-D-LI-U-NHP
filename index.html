<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản Lý Dữ Liệu | Nguyễn Hữu Phước</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#070b18; --glass:rgba(255,255,255,.07); --border:rgba(255,255,255,.14);
    --text:#eef2ff; --muted:#9ba6c7; --primary:#3ecf8e; --accent:#6366f1;
    --danger:#ff5c6c; --input:rgba(255,255,255,.08); --warn:#fbbf24;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter','Segoe UI',system-ui,-apple-system,Roboto,sans-serif}
  html,body{min-height:100%}
  body{background:var(--bg);color:var(--text);overflow-x:hidden}

  /* ===== NỀN ĐỘNG ===== */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(135deg,#070b18,#0d1530 50%,#07131f)}
  .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;will-change:transform}
  .b1{width:520px;height:520px;background:#3ecf8e;top:-120px;left:-100px;animation:f1 18s ease-in-out infinite}
  .b2{width:600px;height:600px;background:#6366f1;bottom:-180px;right:-120px;animation:f2 22s ease-in-out infinite}
  .b3{width:420px;height:420px;background:#06b6d4;top:40%;left:55%;animation:f3 26s ease-in-out infinite;opacity:.35}
  .b4{width:360px;height:360px;background:#a855f7;top:55%;left:-80px;animation:f2 30s ease-in-out infinite reverse;opacity:.3}
  @keyframes f1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(160px,120px) scale(1.2)}}
  @keyframes f2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-180px,-100px) scale(1.15)}}
  @keyframes f3{0%,100%{transform:translate(0,0)}33%{transform:translate(-200px,80px)}66%{transform:translate(100px,-120px)}}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
    background-size:48px 48px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);animation:gm 40s linear infinite}
  @keyframes gm{to{background-position:48px 48px}}
  canvas#particles{position:absolute;inset:0;width:100%;height:100%}

  /* ===== KHUNG ===== */
  .page{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px}
  .shell{width:100%;max-width:960px;display:grid;grid-template-columns:1fr 440px;background:var(--glass);border:1px solid var(--border);border-radius:26px;overflow:hidden;
    backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 30px 80px rgba(0,0,0,.5);animation:rise .7s cubic-bezier(.2,.8,.2,1)}
  @keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
  .shell.single{max-width:720px;grid-template-columns:1fr}
  .shell.wide{max-width:1040px;grid-template-columns:1fr}
  .shell.single .hero,.shell.wide .hero{display:none}

  .hero{padding:48px 40px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(160deg,rgba(62,207,142,.18),rgba(99,102,241,.18));border-right:1px solid var(--border)}
  .logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px}
  .logo i{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:22px;background:linear-gradient(135deg,var(--primary),var(--accent));box-shadow:0 8px 24px rgba(62,207,142,.35)}
  .hero h1{font-size:34px;line-height:1.2;margin:34px 0 14px;font-weight:800}
  .hero h1 span{background:linear-gradient(90deg,var(--primary),#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--muted);line-height:1.65;font-size:15px}
  .feats{list-style:none;margin-top:28px;display:grid;gap:12px}
  .feats li{display:flex;gap:12px;align-items:center;font-size:14px;color:#d6dcf3}
  .feats li b{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.1);font-weight:400}
  .hero small{color:var(--muted);font-size:12px;margin-top:30px;display:block}

  .panel{padding:40px 36px;min-width:0}
  .shell.single .panel,.shell.wide .panel{padding:32px 36px}
  .panel h2{font-size:24px;font-weight:800;margin-bottom:6px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:22px;line-height:1.5}

  .status{display:inline-flex;align-items:center;gap:8px;font-size:12px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--muted);margin-bottom:18px}
  .dot{width:8px;height:8px;border-radius:50%;background:#888}
  .status.ok{color:var(--primary)} .status.ok .dot{background:var(--primary);box-shadow:0 0 10px var(--primary)}
  .status.err{color:var(--danger)} .status.err .dot{background:var(--danger)}

  .tabs{display:flex;background:rgba(255,255,255,.07);border-radius:12px;padding:4px;margin-bottom:18px;gap:2px;overflow-x:auto}
  .tab{flex:1;padding:10px 12px;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:14px;border-radius:9px;cursor:pointer;transition:.25s;white-space:nowrap}
  .tab.active{background:linear-gradient(135deg,var(--primary),#2bb6a0);color:#05261a;box-shadow:0 6px 16px rgba(62,207,142,.3)}
  .tabs.small .tab{font-size:13px;padding:8px}

  .field{margin-bottom:14px}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .input-wrap{position:relative}
  input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],textarea{
    width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--border);background:var(--input);color:var(--text);font-size:15px;outline:none;transition:.2s;resize:vertical}
  input:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(62,207,142,.22);background:rgba(255,255,255,.11)}
  input::placeholder,textarea::placeholder{color:#6d789a}
  .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;padding:6px}
  .check{display:flex;align-items:center;gap:10px;margin:2px 0 14px;font-size:14px;color:var(--text);cursor:pointer}
  .check input{width:18px;height:18px;accent-color:var(--primary)}

  .btn{width:100%;padding:14px;border:0;border-radius:11px;font-size:15px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--primary),#2bb6a0);color:#05261a;transition:.2s;box-shadow:0 10px 24px rgba(62,207,142,.28)}
  .btn:hover{transform:translateY(-2px);filter:brightness(1.07)}
  .btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
  .btn.ghost{background:rgba(255,255,255,.1);color:var(--text);box-shadow:none;width:auto;padding:9px 16px;font-size:13px}
  .btn.danger{background:linear-gradient(135deg,#ff5c6c,#e11d48);color:#fff;box-shadow:0 10px 24px rgba(225,29,72,.28)}
  .btn.sm{width:auto;padding:8px 14px;font-size:12.5px;box-shadow:none}
  .btn.violet{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;box-shadow:0 10px 24px rgba(99,
